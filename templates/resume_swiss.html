<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{NAME}} — {{SUBTITLE}}</title>
<!--
  包公.skill v3.6 — Times New Roman Traditional Style
  Design: serif body font, bold-prefix bullets, 1-column layout
  Print-optimized for A4, no JS dependency.
  DEFAULT density = single-page-safe baseline (fits ~12-16 bullets on one A4 page).
  For sparse content (<=10 bullets, looks too tight) add data-density="relaxed" to <body>.
-->
<style>
:root {
    --primary: #1a1a1a;
    --secondary: #555;
    --muted: #777;
    --border: #d4d4d4;
    --line: #333;
    /* DEFAULT = single-page-safe baseline (validated for 12-16 bullets on one A4 page) */
    --fs-name: 17pt;
    --fs-subtitle: 9pt;
    --fs-section: 9.5pt;
    --fs-body: 8.5pt;
    --fs-small: 8pt;
    --fs-meta: 7.5pt;
    --lh-body: 1.22;
    --lh-tight: 1.18;
    --gap-section: 3pt;
    --gap-item: 2.5pt;
    --gap-bullet: 0.3pt;
    --page-pad-v: 8mm;
    --page-pad-h: 10mm;
}
/* Sparse content (<=10 bullets): add data-density="relaxed" to <body> to loosen spacing */
body[data-density="relaxed"] {
    --fs-name: 18pt;
    --fs-body: 9pt;
    --lh-body: 1.3;
    --lh-tight: 1.2;
    --gap-section: 4pt;
    --gap-item: 3pt;
    --gap-bullet: 0.5pt;
    --page-pad-v: 10mm;
    --page-pad-h: 14mm;
}
/* Overflow last resort (17+ bullets still spilling): add data-density="ultra" */
body[data-density="ultra"] {
    --fs-body: 8pt;
    --lh-body: 1.15;
    --lh-tight: 1.12;
    --gap-section: 2.5pt;
    --gap-item: 2pt;
    --gap-bullet: 0.2pt;
    --page-pad-v: 7mm;
    --page-pad-h: 9mm;
}
@media print {
    @page { size: A4; margin: 8mm; }
    body { background: #fff; margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "Times New Roman", Times, serif, "Microsoft YaHei", "微软雅黑", sans-serif;
    color: var(--primary); font-size: var(--fs-body); line-height: var(--lh-body);
    text-align: justify; word-break: break-word; padding: var(--page-pad-v) var(--page-pad-h); background: #fff;
}
.header { text-align: center; margin-bottom: 3pt; padding-bottom: 3pt; border-bottom: 1.2pt solid var(--line); }
.header h1 { font-size: var(--fs-name); font-weight: 700; letter-spacing: 0.02em; margin-bottom: 0pt; }
.header .subtitle { font-size: var(--fs-subtitle); color: var(--secondary); font-weight: 400; letter-spacing: 0.03em; margin-bottom: 2pt; }
.contact-info { display: flex; justify-content: center; flex-wrap: wrap; gap: 4pt 16pt; font-size: var(--fs-small); color: var(--muted); }
.contact-info span { white-space: nowrap; }
.contact-info span:not(:last-child)::after { content: " | "; color: var(--border); margin-left: 8pt; }
.section-title { font-size: var(--fs-section); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-top: var(--gap-section); margin-bottom: 2pt; padding-bottom: 1pt; border-bottom: 0.6pt solid var(--border); }
.summary-block { font-size: var(--fs-small); color: var(--secondary); line-height: var(--lh-tight); margin: 4pt 0 2pt 0; }
.experience-item { margin-bottom: var(--gap-item); break-inside: avoid; }
.exp-header-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 9.5pt; margin-top: 1pt; }
.exp-header-row .company-title { flex: 1; }
.exp-header-row .date-range { white-space: nowrap; color: var(--secondary); font-weight: 400; font-size: var(--fs-small); min-width: 70pt; text-align: right; }
.exp-sub-row { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-meta); color: var(--muted); font-style: italic; margin-bottom: 0pt; }
.exp-sub-row .location { white-space: nowrap; font-style: normal; }
ul { list-style: disc; padding-left: 1rem; margin: 0pt 0 0 0; }
li { margin-bottom: var(--gap-bullet); line-height: var(--lh-tight); }
.bullet-summary { font-weight: 700; }
.education-item { margin-bottom: var(--gap-item); break-inside: avoid; }
.edu-degree-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 9.5pt; }
.edu-degree-row .degree { flex: 1; }
.edu-degree-row .edu-date { white-space: nowrap; color: var(--secondary); font-weight: 400; font-size: var(--fs-small); }
.edu-school-row { display: flex; justify-content: space-between; font-size: var(--fs-small); color: var(--muted); }
.edu-school-row .edu-location { white-space: nowrap; }
.skills-grid { display: grid; grid-template-columns: 80pt 1fr; gap: 1pt 6pt; font-size: var(--fs-small); }
.skills-grid .skill-label { font-weight: 700; white-space: nowrap; }
.skills-grid .skill-value { color: var(--secondary); }
.project-item { margin-bottom: var(--gap-item); break-inside: avoid; }
.project-header-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 9.5pt; margin-top: 1pt; }
.project-header-row .project-name { flex: 1; }
.project-header-row .project-date { white-space: nowrap; color: var(--secondary); font-weight: 400; font-size: var(--fs-small); min-width: 70pt; text-align: right; }
.project-sub-row { font-size: var(--fs-meta); color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<div class="header">
    <h1>{{NAME}}</h1>
    <div class="subtitle">{{SUBTITLE_TEXT}}</div>
    <div class="contact-info">
        {{CONTACT_ITEMS}}
    </div>
</div>

{{SUMMARY_SECTION}}

{{EDUCATION_SECTION}}

{{EXPERIENCE_SECTION}}

{{PROJECTS_SECTION}}

{{SKILLS_SECTION}}

</body>
</html>
